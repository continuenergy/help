<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
<meta name="googlebot" content="noindex, nofollow, noimageindex">
<title>Continu Help</title>
<style>
:root{--navy:#2A4356;--navy2:#324E64;--green:#B5EB03;--sage:#9AC490;--sky:#A5D4F0;--mist:#C2D0DA;--mauve:#CEA1C6;--stone:#B8C2B2;
  --bg:#E9ECE7;--ink:#2A4356;--soft:#fff;--soft2:#F4F6F3;--muted:#5F7383;--pillOn:#2A4356;--panel:#fff;--logo:#2A4356;--drawer:#E9ECE7}
body.dark{--bg:#2A4356;--ink:#fff;--soft:#324E64;--soft2:#3A5A72;--muted:#B8C2B2;--pillOn:#B5EB03;--panel:#324E64;--logo:#fff;--drawer:#2A4356}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);overflow-x:clip;transition:background .25s}
body{min-height:100vh;color:var(--ink);font-family:Effra,"Inter","Segoe UI",system-ui,sans-serif;line-height:1.45;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.pad{padding-left:clamp(20px,3.5vw,64px);padding-right:clamp(20px,3.5vw,64px)}
.page{position:relative;overflow:clip}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:24px;padding-bottom:24px;position:relative;z-index:3}
.logo{height:56px;width:auto;color:var(--logo);display:block;flex:0 0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:10px 16px;width:min(320px,42vw)}
.search input{border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;width:100%;min-width:0}
.search input::placeholder{color:var(--muted)}
.search svg{flex:0 0 16px;stroke:var(--ink)}
.switches{display:flex;gap:20px;margin-left:auto;margin-right:12px}
.seg{display:inline-flex;gap:4px;background:var(--soft);border-radius:999px;padding:5px}
.seg button{padding:10px 20px;border-radius:999px;font-size:15px;display:flex;align-items:center;gap:9px;min-height:44px}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
body.dark .seg button.on{background:var(--green);color:#2A4356}
.ico{width:22px;height:22px;border-radius:5px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.ico-p{background:#2A4356}.ico-w{background:#5F7383}
body.dark .ico-p{background:#B5EB03;color:#2A4356}body.dark .ico-w{background:#C2D0DA;color:#2A4356}
.seg button.on .ico{box-shadow:0 0 0 2px var(--bg)}
.appicon{width:22px;height:22px;display:none;object-fit:contain}
.appicon.ok{display:block}.appicon.ok + .ico{display:none}
.soon{padding:40px 0 20px;font-size:18px;display:none}
.burger{display:none;width:48px;height:48px;border-radius:50%;background:var(--soft);align-items:center;justify-content:center;flex:0 0 48px}
.burger svg{stroke:var(--ink)}
/* layout */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:clamp(20px,3vw,48px);position:relative;z-index:2}
.side{align-self:start;padding:22px 20px;background:var(--soft);border-radius:24px;margin-top:8px}
.side .count{font-size:13px;color:var(--muted);margin-bottom:6px}
.side .grp{display:block;width:100%;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin:14px 0 4px;padding:6px 10px;margin-left:-10px;margin-right:-10px;width:calc(100% + 20px);border-radius:10px;color:var(--muted)}
.side .grp:hover{background:var(--soft2)}
.side .grp.on{background:var(--green);color:#2A4356}
.side a{display:flex;align-items:center;gap:10px;padding:7px 10px;margin:0 -10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px}
.side a i{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.side a:hover{background:var(--soft2)}
body.light .side{background:#fff}
.side a.hide{display:none}
/* hero */
.hero{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:32px;align-items:end;padding:28px 0 32px}
.intro .dot{width:44px;height:44px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
body.dark .intro .dot{background:#fff}
.intro .dot i{width:18px;height:18px;border-radius:50%;border:5px solid var(--green)}
.intro p{font-size:16px;max-width:360px}
h1{font-weight:300;font-size:clamp(46px,7.4vw,118px);line-height:1;letter-spacing:-.03em}
h1 em{font-style:normal;color:var(--navy)}
body.dark h1 em{color:var(--green)}
/* desktop: title on one line across the top (wraps if the window is narrow), intro underneath, no icon */
@media (min-width:981px){
  .hero{grid-template-columns:1fr;gap:18px;align-items:start}
  .hero h1{order:-1;font-size:clamp(56px,6.4vw,112px)}
  .hero h1 br{display:none}
  .intro .dot{display:none}
  .intro p{max-width:560px}
}
.rings{position:absolute;top:-40px;right:-140px;width:640px;height:540px;pointer-events:none;z-index:1}
/* area tabs (above the cards) */
.pills{display:inline-flex;gap:4px;background:var(--soft);border-radius:999px;padding:5px;flex-wrap:wrap;margin-bottom:18px}
.pill{padding:8px 16px;border-radius:999px;font-size:14px}
.pill:hover{background:var(--soft2)}
.pill.on{background:var(--pillOn);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
body.dark .pill.on{color:#2A4356}
.areasel{display:none;position:sticky;top:10px;z-index:5;margin-bottom:16px}
.areasel select{width:100%;appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:14px 48px 14px 20px;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--soft) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2716%27 height=%2716%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23B5EB03%27 stroke-width=%273%27%3E%3Cpath d=%27M6 9l6 6 6-6%27/%3E%3C/svg%3E") no-repeat right 20px center;box-shadow:0 6px 18px rgba(20,32,42,.18)}
.areasel select.picked{background-color:var(--green);color:#2A4356;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2716%27 height=%2716%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%232A4356%27 stroke-width=%273%27%3E%3Cpath d=%27M6 9l6 6 6-6%27/%3E%3C/svg%3E")}
.filter{display:none;align-items:center;gap:8px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.filter button{background:var(--green);color:#2A4356;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
/* cards */
.main{min-width:0}
.trackwrap{margin-right:calc(-1*clamp(20px,3.5vw,64px))}
.track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px clamp(20px,3.5vw,64px) 22px 0;scrollbar-width:none;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track.dragging{cursor:grabbing;scroll-snap-type:none}.track.dragging .card{pointer-events:none}
.card{flex:0 0 clamp(300px,30vw,500px);aspect-ratio:1.42;border-radius:28px;position:relative;overflow:hidden;scroll-snap-align:start;text-align:left;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;color:#2A4356;transition:transform .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);outline:none}
.card .pic{position:absolute;top:20px;right:20px;width:54%;height:50%;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.45)}
.card .pic img{width:100%;height:100%;object-fit:cover;display:block}
.card .go{position:absolute;top:22px;left:22px;width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.badge{display:inline-block;border:1.4px solid currentColor;border-radius:999px;padding:1px 9px;font-size:12px;margin-bottom:8px;align-self:flex-start}
.card b{font-size:clamp(20px,1.9vw,28px);font-weight:500;line-height:1.1;max-width:62%}
.card small{font-size:14px;margin-top:6px}
.c0{background:var(--green)}.c1{background:var(--sky)}.c2{background:var(--sage)}.c3{background:var(--mauve)}.c4{background:var(--mist)}.c5{background:var(--stone)}
.nav{display:flex;align-items:center;gap:14px}
.progress{flex:1;height:6px;border-radius:6px;background:var(--soft);position:relative;cursor:pointer}
.progress:before{content:"";position:absolute;inset:-10px 0}
.progress i{position:absolute;top:0;height:100%;border-radius:6px;background:var(--ink);cursor:grab}
body.dark .progress i{background:var(--green)}
.arw{width:42px;height:42px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.arw:hover{background:var(--green)}.arw:disabled{opacity:.35;cursor:default;background:var(--soft)}
.arw svg{stroke:var(--ink)}.arw:hover:not(:disabled) svg{stroke:#2A4356}
.empty{padding:20px 0;color:var(--muted);display:none}
footer{padding-top:40px;padding-bottom:36px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* mobile menu */
.drawer{position:fixed;inset:0;z-index:20;display:none}
.drawer.on{display:block}
.drawer .shade{position:absolute;inset:0;background:rgba(20,32,42,.5)}
.drawer .sheet{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--drawer);padding:20px 20px 40px;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.drawer .head b{font-size:20px;font-weight:500}
.drawer .x{width:44px;height:44px;border-radius:50%;background:var(--soft);font-size:18px}
.drawer .area{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--green);color:#2A4356;border-radius:16px;padding:14px 16px;font-weight:600;font-size:17px;margin-top:14px;text-align:left}
.drawer .area span{font-weight:500;font-size:14px;opacity:.8}
.drawer .area.all{background:var(--soft);color:var(--ink)}
.drawer .area.on{box-shadow:0 0 0 3px var(--ink)}
.drawer a{display:flex;align-items:center;gap:12px;padding:12px 6px;color:var(--ink);text-decoration:none;font-size:16px;border-bottom:1px solid var(--soft)}
.drawer a i{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
/* viewer */
.viewer{position:fixed;inset:0;background:rgba(20,32,42,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
.viewer.on{display:flex}
.panel{background:var(--panel);border-radius:28px;width:min(1280px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr 330px}
.media{background:#1d3040;display:flex;align-items:center;justify-content:center;min-height:240px}
.media img{width:100%;height:auto;display:block}
.text{padding:28px;position:relative}
.text h3{font-weight:400;font-size:26px;line-height:1.1;margin:10px 0 16px;padding-right:44px}
.text ol{list-style:none;counter-reset:s}
.text li{counter-increment:s;position:relative;padding-left:36px;margin-bottom:12px;font-size:15px}
.text li:before{content:counter(s);position:absolute;left:0;top:0;width:25px;height:25px;border-radius:50%;background:var(--green);color:#2A4356;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tip{margin-top:16px;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px}
body.dark .tip{background:var(--soft2)}
.close{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;background:var(--soft)}
/* ---------- mobile ---------- */
@media (max-width:980px){
  .layout{grid-template-columns:1fr}.side{display:none}
  .burger{display:flex}
  .logo{height:44px}
  .bar{gap:10px;padding-top:18px;padding-bottom:10px}
  .search{flex:1;width:auto}
  .switches{order:4;width:100%;margin:8px 0 0;gap:12px;justify-content:space-between}
  .seg button{padding:8px 14px;font-size:14px}
  .bar{flex-wrap:wrap}
  .hero{grid-template-columns:1fr;gap:20px;padding:18px 0 24px}
  h1{font-size:clamp(44px,13vw,72px)}
  .rings{width:360px;height:300px;top:60px;right:-160px;opacity:.6}
  .nav{display:none}
  .pills{display:none}
  .areasel{display:block}
  .trackwrap{margin-right:0}
  .track{flex-direction:column;overflow:visible;padding:0;gap:16px;cursor:default;scroll-snap-type:none}
  .card{flex:none;width:100%;aspect-ratio:auto;padding:16px 16px 20px;justify-content:flex-start;border-radius:24px}
  .card .pic{position:relative;top:auto;right:auto;width:100%;height:auto;aspect-ratio:16/9;margin-bottom:14px;border-radius:16px}
  .card .go{top:26px;left:auto;right:26px;width:36px;height:36px;z-index:1}
  .card b{max-width:none;font-size:21px}
  .card small{font-size:13px}
  .panel{grid-template-columns:1fr}
  .text{padding:20px}
  footer{flex-direction:column}
}
</style>
</head>

    <nav class="pills" id="pills" aria-label="Help areas"></nav>
    <div class="filter" id="filter"></div>
    <label class="areasel"><select id="areaSel" aria-label="Filter topic"></select></label>
    <div class="trackwrap"><div class="track" id="track"></div></div>
    <div class="nav" id="navrow"><button class="arw" id="prev" aria-label="Previous topics"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></button><div class="progress" id="progress"><i id="thumb"></i></div><button class="arw" id="next" aria-label="More topics"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <p class="empty" id="empty">No topic matches that yet.</p>
    <p class="soon" id="soon">Word help is coming soon.</p>
  </main>
</div>
<footer class="pad"><span>Continu Help · PowerPoint and Word</span><span>Each animation loops – watch it as many times as you like.</span></footer>
</div>

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Help topics"><div class="shade" id="shade"></div><div class="sheet">
  <div class="head"><b>Help topics</b><button class="x" id="dclose" aria-label="Close menu">✕</button></div>
  <div id="dmenu"></div>
</div></div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true"><div class="panel">
  <div class="media"><img id="gif" alt=""></div>
  <div class="text"><button class="close" id="close" aria-label="Close">✕</button><span class="badge" id="vbadge"></span><h3 id="title"></h3><ol id="steps"></ol><div class="tip" id="tip"></div></div>
</div></div>
<script>
// ---- Topics. Add one entry per how-to. id = link anchor (…/help.html#crop-image).
// media = file name (no extension) of the GIF + JPG in assets/GIFs/. Demo topics reuse two recordings for now.
const DIR = "assets/GIFs/";
const RAW = "https://raw.githubusercontent.com/continuenergy/help/main/assets/GIFs/";
const TOPICS = [
 // app: "powerpoint" | "word".  media/steps: {mac, pc} – if only one is given it is used for both.
 // keywords: extra search words people might type.  Demo topics reuse two Mac recordings for now.
 {id:"crop-image",app:"powerpoint",group:"Images",title:"Crop an image",time:"25 sec",keywords:"trim cut picture photo",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:{mac:["Click the picture","Open the <b>Picture Format</b> tab","Click <b>Crop</b> (right-hand end of the ribbon)","Drag the picture or its corners to reposition it","Click <b>Crop</b> again to finish"],
         pc:["Click the picture","Open the <b>Picture Format</b> tab","Click <b>Crop</b> (in the Size group)","Drag the picture or its corners to reposition it","Click <b>Crop</b> again, or press Esc, to finish"]},
  tip:"In a picture placeholder, <b>Crop → Fill</b> fills the frame and <b>Crop → Fit</b> shows the whole picture."},
 {id:"replace-picture",app:"powerpoint",group:"Images",title:"Replace a picture",time:"15 sec",keywords:"swap change image photo",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:{mac:["Right-click the picture","Choose <b>Change Picture → From a File…</b>","Pick your image – it keeps the same size and position"],
         pc:["Right-click the picture","Choose <b>Change Picture → From a File…</b>","Pick your image – it keeps the same size and position"]}},
 {id:"drag-picture",app:"powerpoint",group:"Images",title:"Drag a picture in from a folder",time:"10 sec",keywords:"drop finder explorer replace image photo",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:{mac:["Open the folder in Finder next to PowerPoint","Drag the picture onto the empty picture box on the slide","Let go – it drops into the frame"],
         pc:["Open the folder in File Explorer next to PowerPoint","Drag the picture onto the empty picture box on the slide","Let go – it drops into the frame"]}},
 {id:"fill-fit",app:"powerpoint",group:"Images",title:"Fill or fit a picture in its frame",time:"15 sec",keywords:"crop resize image photo",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:["Click the picture","Open the <b>Picture Format</b> tab","Click the small arrow under <b>Crop</b>","Choose <b>Fill</b> to fill the frame, or <b>Fit</b> to show the whole picture","Click <b>Crop</b> to finish"]},
 {id:"background-colour",app:"powerpoint",group:"Slides",title:"Change the background colour",time:"15 sec",keywords:"background color colour dark light fill navy white theme",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:["Select the slide","On the <b>Home</b> tab, click <b>Layout</b>","Pick the <b>light</b> or <b>dark</b> version of the same layout – your content moves across"],
  tip:"Only if there's no light/dark version: <b>Design → Format Background → Solid fill</b>, then pick a colour from <b>Theme Colours</b> – never a custom colour."},
 {id:"paste-text",app:"powerpoint",group:"Text",title:"Paste text without its formatting",time:"10 sec",keywords:"paste keep text only plain word email font wrong",
  media:{mac:"link-text",pc:"link-text"},
  steps:{mac:["Copy the text from Word, email or a web page","Click into the text box on the slide","Press <b>Cmd+Shift+Option+V</b> – or paste, click the clipboard icon and choose <b>Keep Text Only</b>"],
         pc:["Copy the text from Word, email or a web page","Click into the text box on the slide","Right-click and choose <b>Keep Text Only</b> (the clipboard icon with an A)"]},
  tip:"This is the main way wrong fonts and colours get into a deck."},
 {id:"format-painter",app:"powerpoint",group:"Text",title:"Copy formatting with Format Painter",time:"15 sec",keywords:"style match brush copy format",
  media:{mac:"link-text",pc:"link-text"},
  steps:["Click inside the text that has the style you want","On the <b>Home</b> tab, click <b>Format Painter</b> (the brush)","Drag across the text you want to change"],
  tip:"Double-click the brush to apply it several times; press Esc to stop."},
 {id:"green-words",app:"powerpoint",group:"Text",title:"Turn key words green",time:"15 sec",keywords:"highlight colour color emphasis font",
  media:{mac:"link-text",pc:"link-text"},
  steps:["Select the word or phrase","On the <b>Home</b> tab, click the arrow next to <b>Font Colour</b>","Choose the Continu green from <b>Theme Colours</b>"],
  tip:"Highlight one short phrase per title – the words that carry the message."},
 {id:"fit-text",app:"powerpoint",group:"Text",title:"Make text fit without shrinking it",time:"20 sec",keywords:"overflow too long shrink font size autofit",
  media:{mac:"link-text",pc:"link-text"},
  steps:["Click into the text box and see where the text runs past the box","Shorten the copy – aim for the same number of lines as the original","Keep the font size as it is; never resize the box"]},
 {id:"link-text",app:"powerpoint",group:"Links",title:"Hyperlink text",time:"25 sec",keywords:"link url website hyperlink",
  media:{mac:"link-text",pc:"link-text"},
  steps:{mac:["Select the text you want to link","Right-click and choose <b>Link…</b> (or Cmd+K)","Type or paste the web address, then click <b>OK</b>","Click away – the text is now a link"],
         pc:["Select the text you want to link","Right-click and choose <b>Link</b> (or Ctrl+K)","Type or paste the web address, then click <b>OK</b>","Click away – the text is now a link"]},
  tip:"Use <b>This Document</b> / <b>Place in This Document</b> to link to another slide. Links work in Slide Show."},
 {id:"link-object",app:"powerpoint",group:"Links",title:"Hyperlink a button or image",time:"20 sec",keywords:"link shape icon picture button url slide",
  media:{mac:"link-text",pc:"link-text"},
  steps:{mac:["Click the edge of the button or image so the whole thing is selected","Press <b>Cmd+K</b> (or <b>Insert → Link</b>)","Type a web address – or choose <b>This Document</b> and pick a slide","Click <b>OK</b>"],
         pc:["Click the edge of the button or image so the whole thing is selected","Press <b>Ctrl+K</b> (or <b>Insert → Link</b>)","Type a web address – or choose <b>Place in This Document</b> and pick a slide","Click <b>OK</b>"]},
  tip:"Links only work in Slide Show."},
 {id:"new-slide",app:"powerpoint",group:"Slides",title:"Add a new slide from a layout",time:"10 sec",keywords:"insert new slide layout template",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:["On the <b>Home</b> tab, click the arrow on <b>New Slide</b>","Pick the layout you need","Click into the boxes to add your content"]},
 {id:"change-layout",app:"powerpoint",group:"Slides",title:"Change a slide's layout",time:"15 sec",keywords:"columns 3 4 5 switch layout design",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:["Select the slide","On the <b>Home</b> tab, click <b>Layout</b>","Pick the layout you want – e.g. 4 columns instead of 3 – your content moves into the new boxes"]},
 {id:"reset-slide",app:"powerpoint",group:"Slides",title:"Reset a slide to its design",time:"10 sec",keywords:"reset fix moved broken design",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:["Select the slide","On the <b>Home</b> tab, click <b>Reset</b>","Positions, sizes and text styles go back to the template – your words stay"]},
 {id:"reorder-slides",app:"powerpoint",group:"Slides",title:"Reorder slides by dragging",time:"10 sec",keywords:"move order drag drop sections",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:["In the slide thumbnails on the left, click a slide","Drag it up or down to its new place","Let go – drag onto a section name to move it into that section"]},
 {id:"add-table",app:"powerpoint",group:"Tables",title:"Add a table",time:"15 sec",keywords:"table grid rows columns insert",
  media:{mac:"link-text",pc:"link-text"},
  steps:["Click the table icon in an empty content box – or go to <b>Insert → Table</b>","Choose how many columns and rows you need","Click into the cells and type"],
  tip:"The table picks up the Continu fonts and colours automatically."},
 {id:"table-rows",app:"powerpoint",group:"Tables",title:"Add or delete rows and columns",time:"15 sec",keywords:"table row column insert delete remove",
  media:{mac:"link-text",pc:"link-text"},
  steps:{mac:["Click into a cell next to where you want the change","Open the <b>Table Layout</b> tab","Click <b>Insert Above / Below / Left / Right</b> – or <b>Delete</b> to remove"],
         pc:["Click into a cell next to where you want the change","Open the table <b>Layout</b> tab","Click <b>Insert Above / Below / Left / Right</b> – or <b>Delete</b> to remove"]},
  tip:"Press Tab in the last cell to add a new row at the bottom."},
 {id:"table-style",app:"powerpoint",group:"Tables",title:"Apply the Continu table style",time:"10 sec",keywords:"table style design colours colors header",
  media:{mac:"link-text",pc:"link-text"},
  steps:["Click anywhere in the table","Open the <b>Table Design</b> tab","Pick a style from the gallery – the first row uses the Continu colours"]},
 {id:"paste-excel-table",app:"powerpoint",group:"Tables",title:"Paste a table from Excel",time:"15 sec",keywords:"excel spreadsheet paste table cells",
  media:{mac:"link-text",pc:"link-text"},
  steps:["Copy the cells in Excel","In PowerPoint, click on the slide and paste","Click the paste icon that appears and choose <b>Use Destination Styles</b>","Then apply a style from <b>Table Design</b>"],
  tip:"This keeps the Continu fonts instead of Excel's."},
 {id:"add-chart",app:"powerpoint",group:"Charts",title:"Add a chart",time:"20 sec",keywords:"chart graph bar line pie insert",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:["Click the chart icon in an empty content box – or go to <b>Insert → Chart</b>","Pick the chart type and click <b>OK</b>","Type your numbers into the sheet that opens, then close it"]},
 {id:"chart-data",app:"powerpoint",group:"Charts",title:"Edit chart data",time:"15 sec",keywords:"chart data numbers change update graph",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:["Click the chart","Open the <b>Chart Design</b> tab","Click <b>Edit Data</b>, change the numbers, then close the sheet"]},
 {id:"chart-colours",app:"powerpoint",group:"Charts",title:"Change chart colours to Continu colours",time:"10 sec",keywords:"chart colours colors theme brand palette",
  media:{mac:"crop-image",pc:"crop-image"},
  steps:{mac:["Click the chart","Open the <b>Chart Design</b> tab","Click <b>Change Colors</b> and pick a palette – they all use the Continu theme colours"],
         pc:["Click the chart","Open the <b>Chart Design</b> tab","Click <b>Change Colours</b> and pick a palette – they all use the Continu theme colours"]}},
 {id:"save-template",app:"powerpoint",group:"Saving",title:"Save your deck as a template",time:"15 sec",keywords:"save potx template file copy",
  media:{mac:"link-text",pc:"link-text"},
  steps:{mac:["Click <b>File → Save as Template…</b>","Name it, e.g. “Continu – Proposal”","Click <b>Save</b> – it appears under <b>File → New from Template</b>"],
         pc:["Click <b>File → Save As</b> and pick a folder","Under file type choose <b>PowerPoint Template (*.potx)</b>","Name it and click <b>Save</b> – it appears under <b>File → New → Personal</b>"]}}
];
const $ = id => document.getElementById(id);
const arrow = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A4356" stroke-width="2.4"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const groups = () => [...new Set(inApp().map(t => t.group))];
const colour = t => "c" + (TOPICS.indexOf(t) % 6);
const mobile = () => matchMedia("(max-width:980px)").matches;
let area = "All";
const store = { get:k => { try { return localStorage.getItem(k); } catch(e){ return null; } }, set:(k,v) => { try { localStorage.setItem(k,v); } catch(e){} } };
const os = "pc";  // Continu uses PC only. The Mac / PC version is saved in templates/help-with-mac-pc-switch.html
let app = store.get("help-app") || "powerpoint";
const pick = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[os] || v.mac || v.pc) : v;
const inApp = () => TOPICS.filter(t => t.app === app);
document.querySelectorAll(".appicon").forEach(im => { const base = "assets/Icons/" + im.dataset.icon; im.onload = () => im.classList.add("ok"); im.onerror = () => { if (im.src.endsWith(".svg")) im.src = base + ".png"; else im.remove(); }; im.src = base + ".svg"; });
function switches(){
  document.body.classList.toggle("dark", os==="pc"); document.body.classList.toggle("light", os!=="pc");
  document.querySelectorAll("#appSeg button").forEach(b => b.classList.toggle("on", b.dataset.app===app)); $("appName").textContent = app==="word" ? "Word" : "PowerPoint";
}
document.querySelectorAll("#appSeg button").forEach(b => b.onclick = () => { app = b.dataset.app; store.set("help-app", app); area = "All"; switches(); menus(); render(); });
function src(img, file){ img.onerror = () => { if(!img.src.startsWith(RAW)) img.src = RAW + file; }; img.src = DIR + file; }
function matches(t){ const f = $("q").value.trim().toLowerCase(); return t.app===app && (area==="All"||t.group===area) && (!f || (t.title+" "+t.group+" "+(t.keywords||"")+" "+pick(t.steps).join(" ")).toLowerCase().includes(f)); }
function setArea(g){ area = g; render(); if(mobile()){ const y = $("track").getBoundingClientRect().top + scrollY - 80; if (scrollY > y) window.scrollTo({top:y, behavior:"smooth"});  } }
function menus(){
  // desktop sidebar: area headings filter, topics open
  $("menu").innerHTML = groups().map(g => `<button class="grp" data-g="${g}">${g}</button>` + inApp().filter(t => t.group===g).map(t =>
    `<a href="#${t.id}" data-id="${t.id}"><i class="${colour(t)}"></i>${t.title}</a>`).join("")).join("");
  document.querySelectorAll(".side .grp").forEach(b => b.onclick = () => setArea(area===b.dataset.g ? "All" : b.dataset.g));
  // mobile drawer: green area buttons show all of that area; topics open directly
  $("dmenu").innerHTML = `<button class="area all" data-g="All">All topics <span>${inApp().length}</span></button>` + groups().map(g => {
    const ts = inApp().filter(t => t.group===g);
    return `<button class="area" data-g="${g}">${g} <span>${ts.length}</span></button>` + ts.map(t => `<a href="#${t.id}" data-id="${t.id}"><i class="${colour(t)}"></i>${t.title}</a>`).join("");
  }).join("");
  document.querySelectorAll("#dmenu .area").forEach(b => b.onclick = () => { closeDrawer(); setArea(b.dataset.g); });
  document.querySelectorAll("#dmenu a").forEach(a => a.onclick = () => closeDrawer());
}
function render(){
  const list = TOPICS.filter(matches);
  $("pills").innerHTML = ["All",...groups()].map(g => `<button class="pill${g===area?' on':''}" data-g="${g}">${g}</button>`).join("");
  document.querySelectorAll(".pill").forEach(p => p.onclick = () => setArea(p.dataset.g));
  $("filter").innerHTML = area==="All" ? `<span>Showing all ${list.length} topics</span>` : `<span>Showing</span><button id="clr">${area} ✕</button>`;
  if($("clr")) $("clr").onclick = () => setArea("All");
  $("areaSel").innerHTML = `<option value="All">${area==="All" ? "Filter topic" : "Show all topics"} (${inApp().length})</option>` + groups().map(g => `<option value="${g}"${g===area?" selected":""}>${g} (${inApp().filter(t => t.group===g).length})</option>`).join("");
  $("areaSel").classList.toggle("picked", area!=="All");
  document.querySelectorAll(".side .grp").forEach(b => b.classList.toggle("on", b.dataset.g===area));
  document.querySelectorAll("#dmenu .area").forEach(b => b.classList.toggle("on", b.dataset.g===area));
  $("track").innerHTML = list.map(t =>
    `<button class="card ${colour(t)}" data-id="${t.id}" aria-label="${t.title}">
       <span class="go">${arrow}</span><span class="pic"><img alt="" loading="lazy" data-file="${pick(t.media)}.jpg"></span>
       <span class="badge">${t.group}</span><b>${t.title}</b><small>${pick(t.steps).length} steps · ${t.time}</small></button>`).join("");
  document.querySelectorAll(".card img").forEach(im => src(im, im.dataset.file));
  document.querySelectorAll(".card").forEach(c => c.onclick = () => { location.hash = c.dataset.id; });
  document.querySelectorAll(".side a").forEach(a => a.classList.toggle("hide", !list.some(t => t.id===a.dataset.id)));
  document.querySelectorAll(".side .grp").forEach(h => { let n=h.nextElementSibling, any=false; while(n && n.tagName==="A"){ if(!n.classList.contains("hide")) any=true; n=n.nextElementSibling; } h.style.display = any ? "" : "none"; });
  const n = inApp().length; $("count").textContent = list.length === n ? `${n} topics` : `${list.length} of ${n} topics`;
  $("soon").style.display = inApp().length ? "none" : "block"; $("empty").style.display = (list.length || !inApp().length) ? "none" : "block"; $("track").scrollLeft = 0; prog();
}
function prog(){
  const t = $("track"), max = t.scrollWidth - t.clientWidth, w = t.clientWidth / t.scrollWidth;
  $("navrow").style.visibility = max > 4 ? "visible" : "hidden"; $("prev").disabled = t.scrollLeft < 4; $("next").disabled = t.scrollLeft > max - 4;
  $("thumb").style.width = (w*100) + "%"; $("thumb").style.left = (max>0 ? t.scrollLeft/max*(1-w)*100 : 0) + "%";
}
function open(id){
  const t = TOPICS.find(x => x.id === id); if(!t){ shut(); return; }
  src($("gif"), pick(t.media) + ".gif"); $("gif").alt = t.title + " – animated how-to";
  $("vbadge").textContent = t.group; $("title").textContent = t.title;
  $("steps").innerHTML = pick(t.steps).map(s => `<li>${s}</li>`).join("");
  $("tip").innerHTML = t.tip || ""; $("tip").style.display = t.tip ? "block" : "none";
  $("viewer").classList.add("on"); document.title = t.title + " · Continu Help";
}
function shut(){ $("viewer").classList.remove("on"); $("gif").removeAttribute("src"); document.title = "Continu Help"; }
function closeDrawer(){ $("drawer").classList.remove("on"); document.body.style.overflow = ""; }
$("burger").onclick = () => { $("drawer").classList.add("on"); document.body.style.overflow = "hidden"; };
$("dclose").onclick = closeDrawer; $("shade").onclick = closeDrawer;
$("close").onclick = () => { history.replaceState(null,"",location.pathname); shut(); };  // also clears ?topic=
$("viewer").onclick = e => { if(e.target.id === "viewer") $("close").onclick(); };
document.addEventListener("keydown", e => { if(e.key === "Escape"){ $("close").onclick(); closeDrawer(); } });
$("q").oninput = render; $("areaSel").onchange = e => setArea(e.target.value); $("track").addEventListener("scroll", prog); window.addEventListener("resize", prog);
window.addEventListener("hashchange", () => open(location.hash.slice(1)));
// ---- desktop row scrolling: arrows, wheel, drag, progress bar, keyboard ----
(function(){
  const t = $("track"), bar = $("progress");
  const step = () => (t.querySelector(".card")?.offsetWidth || 400) + 18;
  $("prev").onclick = () => t.scrollBy({left:-step(), behavior:"smooth"});
  $("next").onclick = () => t.scrollBy({left: step(), behavior:"smooth"});
  t.addEventListener("wheel", e => { if (mobile() || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    const max = t.scrollWidth - t.clientWidth;
    if ((e.deltaY > 0 && t.scrollLeft < max - 1) || (e.deltaY < 0 && t.scrollLeft > 1)) { e.preventDefault(); t.scrollLeft += e.deltaY; } }, {passive:false});
  let down = false, sx = 0, sl = 0, moved = false;
  t.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || mobile()) return; down = true; moved = false; sx = e.clientX; sl = t.scrollLeft; });
  window.addEventListener("pointermove", e => { if (!down) return; const dx = e.clientX - sx; if (Math.abs(dx) > 5) { moved = true; t.classList.add("dragging"); } if (moved) t.scrollLeft = sl - dx; });
  window.addEventListener("pointerup", () => { if (!down) return; down = false; setTimeout(() => t.classList.remove("dragging"), 0); });
  t.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  const seek = x => { const r = bar.getBoundingClientRect(), w = $("thumb").offsetWidth, f = Math.min(1, Math.max(0, (x - r.left - w/2) / (r.width - w))); t.scrollLeft = f * (t.scrollWidth - t.clientWidth); };
  let bd = false;
  bar.addEventListener("pointerdown", e => { bd = true; bar.setPointerCapture(e.pointerId); seek(e.clientX); });
  bar.addEventListener("pointermove", e => { if (bd) seek(e.clientX); });
  bar.addEventListener("pointerup", () => bd = false);
  document.addEventListener("keydown", e => { if ($("viewer").classList.contains("on") || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") $("next").click(); if (e.key === "ArrowLeft") $("prev").click(); });
})();
switches(); menus(); render();
{ const sp = new URLSearchParams(location.search), qt = sp.get("topic"), qa = sp.get("area");
  if (qa) { const g = groups().find(x => x.toLowerCase() === qa.toLowerCase()); if (g) { area = g; render(); setTimeout(() => { const el = mobile() ? $("areaSel") : $("pills"); if (el) window.scrollTo({top: el.getBoundingClientRect().top + scrollY - 20}); }, 50); } }
  if (qt) open(qt); else if (location.hash) open(location.hash.slice(1)); }
</script>
